<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地政謄本辨識｜公開測試版</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">LAND REGISTRY OCR</p>
        <h1>地政謄本辨識</h1>
        <p class="lead">上傳 PDF 後由私有後端解析，公開前端只負責上傳與顯示結果，不包含核心文字提取規則。</p>
      </div>
      <span class="badge">公開測試版</span>
    </section>

    <section class="card compact-card">
      <label class="label" for="apiBase">後端 API 網址</label>
      <div class="api-row">
        <input id="apiBase" type="url" autocomplete="off" />
        <button id="saveApi" class="secondary" type="button">儲存</button>
      </div>
      <p class="hint">目前預設連到測試後端，可自行更換。</p>
    </section>

    <section class="card upload-card">
      <input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden />
      <button id="pickFile" class="dropzone" type="button">
        <strong>選擇地政謄本 PDF</strong>
        <span>或將檔案拖曳到這裡</span>
        <small>單檔 20MB 以內</small>
      </button>
      <div id="fileInfo" class="file-info hidden"></div>
      <div class="actions">
        <button id="recognize" class="primary" type="button" disabled>開始辨識</button>
        <button id="clear" class="secondary" type="button" disabled>清除</button>
      </div>
    </section>

    <section id="statusCard" class="card hidden" aria-live="polite">
      <div class="status-line">
        <span id="statusDot" class="status-dot"></span>
        <strong id="statusText">等待中</strong>
      </div>
      <p id="statusDetail" class="hint"></p>
    </section>

    <section id="resultCard" class="card result-card hidden">
      <div class="section-head">
        <div>
          <h2>辨識結果</h2>
          <p id="resultSummary" class="hint"></p>
        </div>
        <div class="result-actions">
          <button id="downloadCsv" class="secondary" type="button">下載 CSV</button>
          <button id="copyResult" class="secondary" type="button">複製 JSON</button>
        </div>
      </div>

      <div id="warningBox" class="warning-box hidden"></div>

      <div class="table-wrap">
        <table id="resultTable">
          <thead>
            <tr>
              <th>項次</th>
              <th>類型</th>
              <th>所有權人</th>
              <th>所有權人證號</th>
              <th>縣市區／地段</th>
              <th>主建號／地號</th>
              <th>建物門牌／地上建號</th>
              <th>持分</th>
              <th>合計坪數</th>
              <th>登記日期</th>
              <th>登記原因</th>
              <th>設定情形</th>
              <th>風險提醒</th>
              <th>謄本日期</th>
              <th>來源檔案</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <details class="raw-panel">
        <summary>查看原始 JSON</summary>
        <pre id="result"></pre>
      </details>
    </section>

    <footer>
      <p>隱私設計：PDF 僅送往私有後端即時處理；目前 API 不主動保存原始檔。圖片型欄位與異動索引 OCR 仍在補強中。</p>
    </footer>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
